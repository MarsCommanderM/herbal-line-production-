name: Temporary dependency remediation

on:
  push:
    branches: ["restore/original-masterpack-product-scope-20261012"]
    paths: [".github/workflows/temporary-dependency-remediation.yml"]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: restore/original-masterpack-product-scope-20261012
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Upgrade audited vulnerable development dependencies
        run: npm install --save-dev --save-exact vite@6.4.4 vitest@5.0.4 @playwright/test@1.64.0 --no-audit --no-fund
      - name: Verify no high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Commit regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files are already current."
            exit 0
          fi
          git commit -m "fix: remediate high and critical npm advisories"
          git push origin HEAD:restore/original-masterpack-product-scope-20261012
