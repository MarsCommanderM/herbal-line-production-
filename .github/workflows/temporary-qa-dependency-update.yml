name: Temporary accessibility dependency update

on:
  push:
    branches: ["restore/original-masterpack-product-scope-20261012"]
    paths: [".github/workflows/temporary-qa-dependency-update.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: restore/original-masterpack-product-scope-20261012
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Add Playwright accessibility engine and refresh lockfile
        run: npm install --save-dev --save-exact @axe-core/playwright@latest --no-audit --no-fund
      - name: Require zero dependency advisories
        run: npm audit
      - name: Regenerate deterministic dependency license inventory
        run: |
          npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/dopefarm-sbom.cdx.json"
          node scripts/generate-dependency-license-inventory.mjs "$RUNNER_TEMP/dopefarm-sbom.cdx.json" > rights/DEPENDENCY_LICENSE_INVENTORY.md
      - name: Commit updated lock and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json rights/DEPENDENCY_LICENSE_INVENTORY.md
          if git diff --cached --quiet; then
            echo "Dependency and inventory files are already current."
            exit 0
          fi
          git commit -m "test: add axe accessibility audit dependency"
          git push origin HEAD:restore/original-masterpack-product-scope-20261012
