name: Dr. Green Dump / DopeFarm — Master Pack Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dopefarm-master-pack-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-master-pack:
    name: Validate master-pack artifacts (not game build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"
      - name: Validate required files, metadata and JSON
        run: python scripts/validate_masterpack.py
      - name: Check patch whitespace
        run: git diff --check
