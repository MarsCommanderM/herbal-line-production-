name: Master Pack Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-pack-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-master-pack:
    name: Validate master-pack artifacts (not game build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate required files, metadata and JSON
        run: python scripts/validate_masterpack.py
      - name: Check patch whitespace
        run: git diff --check
