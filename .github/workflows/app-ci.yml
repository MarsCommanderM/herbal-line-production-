name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: herbal-line-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Create lockfile from exact direct dependency pins when absent
        id: lock
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit initial lockfile on trusted main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lock.outputs.generated == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit lockfile generated from pinned dependencies"
          git push
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate master-pack documents and JSON
        run: npm run validate:masterpack
      - name: Check whitespace
        run: git diff --check
