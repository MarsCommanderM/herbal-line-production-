name: Dr. Green Dump / DopeFarm CI

on:
  push:
    branches: ["main", "restore/original-masterpack-product-scope-20261012"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-green-dump-dopefarm-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and master-pack validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - name: Generate and validate CycloneDX software bill of materials
        run: |
          npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/dopefarm-sbom.cdx.json"
          node -e "const fs=require('node:fs'); const bom=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components) || bom.components.length === 0) { throw new Error('CycloneDX SBOM is missing or invalid'); }" "$RUNNER_TEMP/dopefarm-sbom.cdx.json"
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dopefarm-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/dopefarm-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Source policy lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Strict TypeScript typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium, Firefox, and WebKit system dependencies and browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser end-to-end acceptance
        run: npm run test:e2e
      - name: Serve production build and smoke-test assets
        run: npm run smoke:preview
      - name: Validate master-pack documents and JSON
        run: npm run validate:masterpack
      - name: Verify preserved original Master Pack source snapshot
        run: npm run verify:masterpack-source
      - name: Validate active product policy and visible-care contract
        run: npm run validate:product-policy
      - name: Check whitespace
        run: git diff --check
